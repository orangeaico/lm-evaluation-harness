tag:
  - code_understanding
  - repo_eval
task: repo_eval_calls_what
dataset_path: json
dataset_name: null
dataset_kwargs:
  data_files:
    test: "/home/surya/livup/repo_eval/data/tasks/*/*/CallsWhat.jsonl"
output_type: generate_until
test_split: test
process_docs: !function utils.process_calls_what_docs
