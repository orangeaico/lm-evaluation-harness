    - "<|im_end|>"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 2000
repeats: 1
num_fewshot: 0
metadata:
  version: 1.0
  description: "Call graph analysis task: Given a function/method name, identify what functions it calls"